# The deterministic mock-E2E harness — no network, no LLM calls, stubbed
# agent CLIs. This is the contract test for the skill layer: if it's green,
# the data-file schemas and both apply lifecycles still hold.
name: harness
on:
  push:
    branches: [main]
  pull_request:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install document and CJK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils fonts-noto-cjk
          curl -fsSL -o /tmp/tectonic.tar.gz https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz
          echo "1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606  /tmp/tectonic.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/tectonic.tar.gz -C /usr/local/bin tectonic
      - run: npm run harness
